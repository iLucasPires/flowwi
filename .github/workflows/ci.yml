name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            app:
              - 'apps/app/**'

  backend:
    name: Backend (Django)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: flowwi
          POSTGRES_USER: flowwi
          POSTGRES_PASSWORD: flowwi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowwi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Write .env for CI
        run: |
          cp ../../.env.example .env
          {
            echo "DJANGO_SECRET_KEY=ci-test-secret-key"
            echo "POSTGRES_HOST=localhost"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_DB=flowwi"
            echo "POSTGRES_USER=flowwi"
            echo "POSTGRES_PASSWORD=flowwi"
            echo "REDIS_URL=redis://localhost:6379/0"
            echo "GOOGLE_AI_API_KEY=ci-dummy-key"
          } >> .env

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: uv run python manage.py check

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        run: uv run python manage.py test

  frontend:
    name: Frontend (Vue)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint
          git diff --exit-code --stat

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit --run

      - name: Build
        run: pnpm build
