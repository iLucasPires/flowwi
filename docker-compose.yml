services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowwi}
      POSTGRES_USER: ${POSTGRES_USER:-flowwi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowwi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - flowwi
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flowwi}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - flowwi
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    volumes:
      - mailpit_data:/data
    networks:
      - flowwi
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    profiles: [ "tools" ]
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@flowwi.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "8080:80"
    networks:
      - flowwi

  api:
    build:
      context: ./apps/api
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowwi

  app:
    build:
      context: ./apps/app
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://api:8000
    volumes:
      - ./apps/app:/app
      - app_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - flowwi

  proxy:
    build:
      context: ./apps/proxy
    restart: unless-stopped
    profiles: [ "proxy" ]
    ports:
      - "80:80"
    depends_on:
      - api
      - app
    networks:
      - flowwi

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  pgadmin_data:
  app_node_modules:

networks:
  flowwi:
    driver: bridge
