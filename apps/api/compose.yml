services:
  postgres:
    image: postgres:18.3-alpine
    container_name: app-postgres
    restart: always
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: always
    volumes:
      - redis_data:/data
    env_file:
      - .env
    ports:
      - "6379:6379"
    networks:
      - internal
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: app-pgadmin
    restart: always
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    env_file:
      - .env
    ports:
      - "8080:80"
    networks:
      - internal

  mailpit:
    image: axllent/mailpit
    container_name: app-mailpit
    restart: always
    volumes:
      - mailpit_data:/data
    networks:
      - internal
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_db: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgadmin_data:
  mailpit_data:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
